name: Publish to NPM and GitHub
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish to the npm registry
        required: true
        default: true
        type: boolean
      publish_gpr:
        description: Publish to GitHub Packages
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci

  publish-npm:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish --provenance --access public

  publish-gpr:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_gpr
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: "@soitora"
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
